<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Тетрис">
  <!--
    Маскируемая иконка для PWA: фон во весь квадрат без скруглений,
    фигура ужата в безопасную зону (внутренние 80% — круг диаметром 640).
    Так система может обрезать иконку кругом, скруглением или «каплей».
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2160"/>
      <stop offset="0.55" stop-color="#130f2e"/>
      <stop offset="1" stop-color="#07070c"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="block" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>

    <linearGradient id="blockTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9e0ff"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0b0618" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#a855f7" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#halo)"/>

  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="2">
    <path d="M0 205H1024M0 410H1024M0 615H1024M0 820H1024"/>
    <path d="M205 0V1024M410 0V1024M615 0V1024M820 0V1024"/>
  </g>

  <!-- фигура T, вписанная в круг диаметром 640 (радиус 320 от центра) -->
  <g filter="url(#glow)" transform="translate(512 512) scale(0.62) translate(-512 -512)">
    <rect x="414" y="309" width="196" height="196" rx="34" fill="url(#blockTop)"/>
    <rect x="204" y="519" width="196" height="196" rx="34" fill="url(#block)"/>
    <rect x="414" y="519" width="196" height="196" rx="34" fill="url(#block)"/>
    <rect x="624" y="519" width="196" height="196" rx="34" fill="url(#block)"/>
  </g>

  <g fill="url(#sheen)" transform="translate(512 512) scale(0.62) translate(-512 -512)">
    <rect x="432" y="327" width="160" height="52" rx="20"/>
    <rect x="222" y="537" width="160" height="52" rx="20"/>
    <rect x="432" y="537" width="160" height="52" rx="20"/>
    <rect x="642" y="537" width="160" height="52" rx="20"/>
  </g>
</svg>
