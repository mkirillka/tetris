<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Тетрис: фигура T">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#221a52"/>
      <stop offset="0.55" stop-color="#120e2b"/>
      <stop offset="1" stop-color="#07070c"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="block" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>

    <linearGradient id="blockTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9e0ff"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>

    <clipPath id="tile">
      <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228"/>
    </clipPath>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#0b0618" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="0" stdDeviation="26" flood-color="#a855f7" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#halo)"/>

    <!-- сетка поля -->
    <g stroke="#ffffff" stroke-opacity="0.055" stroke-width="3">
      <path d="M0 128H1024M0 256H1024M0 384H1024M0 512H1024M0 640H1024M0 768H1024M0 896H1024"/>
      <path d="M128 0V1024M256 0V1024M384 0V1024M512 0V1024M640 0V1024M768 0V1024M896 0V1024"/>
    </g>

    <!-- фигура T: верхняя клетка + три нижних -->
    <g filter="url(#glow)">
      <g>
        <rect x="414" y="309" width="196" height="196" rx="34" fill="url(#blockTop)"/>
        <rect x="204" y="519" width="196" height="196" rx="34" fill="url(#block)"/>
        <rect x="414" y="519" width="196" height="196" rx="34" fill="url(#block)"/>
        <rect x="624" y="519" width="196" height="196" rx="34" fill="url(#block)"/>
      </g>
    </g>

    <!-- блики сверху клеток -->
    <g fill="url(#sheen)">
      <rect x="432" y="327" width="160" height="52" rx="20"/>
      <rect x="222" y="537" width="160" height="52" rx="20"/>
      <rect x="432" y="537" width="160" height="52" rx="20"/>
      <rect x="642" y="537" width="160" height="52" rx="20"/>
    </g>
  </g>

  <!-- тонкая рамка по краю плитки -->
  <rect x="1.5" y="1.5" width="1021" height="1021" rx="227" ry="227"
        fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>
</svg>
